name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests ausführen
        run: python -m unittest discover -s tests -v

      - name: Beispielskripte statisch pruefen
        run: |
          for datei in beispiele/*.deu; do
            python main.py --pruefe "$datei" || exit 1
          done

  grammatik:
    name: tree-sitter-Grammatik
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/tree-sitter-deutsch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: tree-sitter-CLI installieren
        run: npm install --no-audit --no-fund

      - name: Parser erzeugen
        run: npx tree-sitter generate

      - name: Eingecheckter Parser ist aktuell
        run: |
          if ! git diff --exit-code -- src/; then
            echo "src/ weicht von grammar.js ab – 'npx tree-sitter generate' ausfuehren und einchecken"
            exit 1
          fi

      - name: Korpus-Tests
        run: npx tree-sitter test

      - name: Alle Beispielskripte parsen
        run: npx tree-sitter parse --quiet --stat ../../beispiele/*.deu

  erweiterung:
    name: VS-Code-Erweiterung
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/vscode-deutsch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Abhaengigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: JSON-Dateien pruefen
        run: |
          for datei in package.json language-configuration.json syntaxes/deutsch.tmLanguage.json; do
            node -e "JSON.parse(require('fs').readFileSync('$datei','utf8'))" || exit 1
            echo "ok  $datei"
          done

      - name: Erweiterung syntaktisch pruefen
        run: node --check src/extension.js

      - name: Hervorhebung testen
        run: npm test

      - name: Paket baut
        run: npx --yes @vscode/vsce package --out /tmp/deutsch.vsix
